<!--
  ПУЛЬТ БЕЗ ОБЛАКА (18.11.2026) — запасной на крайний случай: ElevenLabs, интернет или мозг легли, а робот должен говорить.
  - никакого мозга и микрофона: только заранее записанные фразы — робот физически не может заговорить сам;
  - движок — пульт-сценарий Robby (DGAO 14.11): записи кладутся в память телефона, после первого открытия
    пульт открывается и играет без интернета (sw.js);
  - 🇩🇪/🇬🇧 вверху — на каком языке играют ВСЕ кнопки; у кнопки с ↻ несколько вариантов — каждое нажатие следующий;
  - одна запись за раз: новая обрывает старую; повторное нажатие на играющую — стоп.
  СОБИРАЕТСЯ, НЕ ПРАВИТСЯ РУКАМИ: тексты — fraze.json в папке пульта → python3 scripts/offline_pult.py <папка> → выложить.

<style>
:root{
  --bg:#0c0d10; --panel:#16181d; --line:#2a2e36; --txt:#ececec; --dim:#9aa0aa; --faint:#6b717c;
  --acc:#9b7bff; --plate:#1e2733; --en:#2f6fd6; --ok:#57c785; --bad:#ff6b5a; --open:#e0b040;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px 6px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.hrow2{display:flex;align-items:center;gap:8px;margin-top:6px}
.ttl{font-weight:700;font-size:15px;color:var(--acc);white-space:nowrap}
.ver{font-size:11px;color:var(--faint)}
#mem{color:var(--dim);white-space:nowrap;border:0;background:none;padding:2px 0;font-family:inherit;font-size:12px}
#mem.ok{color:var(--ok)} #mem.bad{color:var(--bad);font-weight:700}
#lang{flex:none;height:40px;min-width:76px;border-radius:10px;border:2px solid var(--acc);background:#1c1f26;color:var(--txt);
  font-weight:800;font-size:15px;font-family:inherit;touch-action:manipulation;padding:0 8px}
#lang.en{background:var(--en);border-color:var(--en);color:#fff}
#nav{flex:1;display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 40px;min-width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#1c1f26;color:var(--txt);
  font-size:17px;font-family:inherit;touch-action:manipulation;padding:0}
#nav button.cur{border-color:var(--acc);background:#262a33}
#scroll{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 120px}
.jwrap{border:1px solid var(--line);border-radius:14px;padding:4px 10px 10px;background:#111317;margin-top:12px}
.jwrap.glav{border-color:var(--acc)}
.jwrap h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:10px 2px 6px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jb{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:var(--plate);color:var(--txt);padding:8px 10px;min-height:58px;
  font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.jb b{display:block;font-size:14px;line-height:1.25;padding-right:26px}
.jb small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;color:var(--dim);overflow:hidden;margin-top:3px}
.jb .vb{position:absolute;right:7px;top:6px;font-size:10px;color:var(--open);font-weight:700}
.jb .fx{position:absolute;right:7px;top:6px;font-size:10px;color:#fff;background:var(--en);border-radius:4px;padding:0 4px;font-weight:700}
.jb .fx.de{background:#555}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#fff;opacity:.85}
.playing{background:var(--acc)!important;color:#fff!important}
.playing small,.playing .vb{color:#fff!important}
.jb.done:not(.playing){opacity:.62}
#stop{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;border:0;border-radius:14px;
  background:#c62828;color:#fff;font-weight:700;font-size:18px;line-height:1.2;font-family:inherit;padding:14px 12px;box-shadow:0 6px 24px #000a;touch-action:manipulation}
#stop small{display:block;font-weight:500;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banner{display:none;background:var(--bad);color:#fff;font-weight:700;padding:8px 16px;font-size:14px}
.foot{margin:28px 0 0;color:var(--faint);font-size:12px;text-align:center}
.foot button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 14px;font-family:inherit;margin-bottom:8px}
@media (min-width:700px){ #scroll,header{padding-left:max(16px,calc(50% - 340px));padding-right:max(16px,calc(50% - 340px))} .jgrid{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>

Management zu Hause?", "f": "audio/de/hallo-5.mp3", "h": "7c9e7170", "d": 9.1}, "en": {"t": "[cheerfully] Hello! I'm Tacto-Bot — an AI robot. Are you in procurement, logistics or supply chain management?", "f": "audio/en/hallo-5.mp3", "h": "a6f94469", "d": 7.5}}]}, {"id": "hoere", "ru": "Слышишь меня? — Да", "v": [{"de": {"t": "[cheerfully] Ja, ich höre Sie! Fragen Sie mich ruhig, was Tacto für den Einkauf macht.", "f": "audio/de/hoere-1.mp3", "h": "8fefb1e5", "d": 4.6}, "en": {"t": "[cheerfully] Yes, I can hear you! Go ahead and ask me what Tacto does for procurement.", "f": "audio/en/hoere-1.mp3", "h": "3663db04", "d": 5.2}}]}, {"id": "laut", "ru": "Не расслышал — повтори", "v": [{"de": {"t": "Pardon, hier ist es gerade etwas laut. Kommen Sie ruhig einen Schritt näher und sagen Sie es bitte noch einmal.", "f": "audio/de/laut-1.mp3", "h": "838cfebb", "d": 6.0}, "en": {"t": "Sorry, it's a bit loud in here. Please step a little closer and say that again.", "f": "audio/en/laut-1.mp3", "h": "3800c9f2", "d": 4.8}}, {"de": {"t": "Entschuldigung, das ist bei mir nicht ganz angekommen. Noch einmal, bitte — ein bisschen lauter?", "f": "audio/de/laut-2.mp3", "h": "caa8d18c", "d": 5.0}, "en": {"t": "Sorry, I didn't quite catch that. Once more, please — a little louder?", "f": "audio/en/laut-2.mp3", "h": "6b2484ce", "d": 5.2}}, {"de": {"t": "Wie bitte? Mein Mikrofon hat gerade mit der Halle gekämpft. Sagen Sie es mir bitte noch einmal?", "f": "audio/de/laut-3.mp3", "h": "1cc3a73d", "d": 5.6}, "en": {"t": "Sorry? My microphone was just fighting the hall. Could you say that again, please?", "f": "audio/en/laut-3.mp3", "h": "45b6afc8", "d": 5.6}}, {"de": {"t": "[apologetic] Oh, das habe ich leider nicht verstanden. Sprechen Sie ruhig etwas lauter — ich bin ganz Ohr.", "f": "audio/de/laut-4.mp3", "h": "52561212", "d": 6.1}, "en": {"t": "[apologetic] Oh, I'm afraid I didn't understand that. Feel free to speak a bit louder — I'm all ears.", "f": "audio/en/laut-4.mp3", "h": "f4b8482e", "d": 5.9}}, {"de": {"t": "Entschuldigen Sie — bei dem Trubel hier ist das untergegangen. Noch einmal, ganz langsam?", "f": "audio/de/laut-5.mp3", "h": "5d0ad820", "d": 6.0}, "en": {"t": "Excuse me — that got lost in all the bustle here. Once more, nice and slowly?", "f": "audio/en/laut-5.mp3", "h": "842063ba", "d": 6.4}}]}, {"id": "moment", "ru": "Секунду…", "v": [{"de": {"t": "Einen kleinen Moment, bitte.", "f": "audio/de/moment-1.mp3", "h": "809f4237", "d": 1.7}, "en": {"t": "Just a moment, please.", "f": "audio/en/moment-1.mp3", "h": "adb566c9", "d": 1.5}}, {"de": {"t": "Hmm — gute Frage. Einen Moment.", "f": "audio/de/moment-2.mp3", "h": "8b044909", "d": 3.5}, "en": {"t": "Hmm — good question. One moment.", "f": "audio/en/moment-2.mp3", "h": "b7f6c96a", "d": 2.9}}]}, {"id": "kollege", "ru": "Это — к коллегам", "v": [{"de": {"t": "Das zeigt Ihnen meine Kollegin oder mein Kollege von Tacto gern direkt. Darf ich Sie kurz rüberbringen?", "f": "audio/de/kollege-1.mp3", "h": "f2bcbeef", "d": 5.9}, "en": {"t": "My colleagues from Tacto will gladly show you that directly. May I send you over to them?", "f": "audio/en/kollege-1.mp3", "h": "77f5ce36", "d": 5.1}}, {"de": {"t": "Das weiß ich nicht, aber meine Kolleginnen und Kollegen von Tacto können das genau beantworten. Sie stehen direkt hier am Stand.", "f": "audio/de/kollege-2.mp3", "h": "a42c03af", "d": 6.9}, "en": {"t": "I don't know that, but my colleagues from Tacto can answer it precisely. They're right here at the stand.", "f": "audio/en/kollege-2.mp3", "h": "4b8b2ce9", "d": 6.0}}, {"de": {"t": "Es ist wirklich laut hier. Meine Kolleginnen und Kollegen von Tacto stehen direkt am Stand und erklären Ihnen gern alles in Ruhe.", "f": "audio/de/kollege-3.mp3", "h": "8e189596", "d": 7.4}, "en": {"t": "It really is loud in here. My colleagues from Tacto are right here at the stand and will gladly explain everything in peace.", "f": "audio/en/kollege-3.mp3", "h": "bf0a23fd", "d": 6.9}}]}, {"id": "danke", "ru": "Спасибо / на комплимент", "v": [{"de": {"t": "[warm] Vielen Dank — das freut mich sehr!", "f": "audio/de/danke-1.mp3", "h": "08a58886", "d": 2.5}, "en": {"t": "[warm] Thank you so much — that makes me happy!", "f": "audio/en/danke-1.mp3", "h": "f262bc18", "d": 2.5}}, {"de": {"t": "[laughs] Danke! Das Kompliment gebe ich gern an mein Team weiter.", "f": "audio/de/danke-2.mp3", "h": "524ab232", "d": 4.4}, "en": {"t": "[laughs] Thanks! I'll gladly pass that compliment on to my team.", "f": "audio/en/danke-2.mp3", "h": "bba3d842", "d": 4.3}}]}, {"id": "ja", "ru": "Да / согласен / смех", "v": [{"de": {"t": "Ganz genau.", "f": "audio/de/ja-1.mp3", "h": "b5ffffb5", "d": 1.3}, "en": {"t": "Exactly.", "f": "audio/en/ja-1.mp3", "h": "65766c6b", "d": 1.2}}, {"de": {"t": "Da haben Sie völlig recht.", "f": "audio/de/ja-2.mp3", "h": "3c9f4169", "d": 1.7}, "en": {"t": "You're absolutely right.", "f": "audio/en/ja-2.mp3", "h": "0ba5c4a6", "d": 1.7}}, {"de": {"t": "[laughs] Der war gut!", "f": "audio/de/ja-3.mp3", "h": "1561ce46", "d": 2.4}, "en": {"t": "[laughs] Good one!", "f": "audio/en/ja-3.mp3", "h": "b59269c1", "d": 2.0}}]}, {"id": "foto", "ru": "Фото", "v": [{"de": {"t": "Ein Foto mit mir? Sehr gern, ich halte still.", "f": "audio/de/foto-1.mp3", "h": "4f779b04", "d": 4.4}, "en": {"t": "A photo with me? Gladly, I'll hold still.", "f": "audio/en/foto-1.mp3", "h": "bc7b8d4d", "d": 4.4}}, {"de": {"t": "[cheerfully] Sehr gern! Ich stelle mich in Pose — bitte recht freundlich.", "f": "audio/de/foto-2.mp3", "h": "cf807056", "d": 4.6}, "en": {"t": "[cheerfully] Gladly! I'll strike a pose — big smiles, please.", "f": "audio/en/foto-2.mp3", "h": "2702beaf", "d": 4.4}}]}, {"id": "bye", "ru": "Пока", "v": [{"de": {"t": "Danke für das Gespräch! Denken Sie dran: Der Wettbewerbsvorteil der Industrie beginnt im Einkauf.", "f": "audio/de/bye-1.mp3", "h": "00fed6cc", "d": 6.7}, "en": {"t": "Thanks for the conversation! Remember: Industrial advantage starts in procurement.", "f": "audio/en/bye-1.mp3", "h": "447f2fa1", "d": 6.6}}, {"de": {"t": "[warm] Schön, dass Sie da waren! Einen erfolgreichen Tag auf dem Symposium.", "f": "audio/de/bye-2.mp3", "h": "cff7f4cf", "d": 4.1}, "en": {"t": "[warm] Great that you stopped by! Have a successful day at the symposium.", "f": "audio/en/bye-2.mp3", "h": "40896025", "d": 4.3}}, {"de": {"t": "Auf Wiedersehen! Und denken Sie dran: Bauchgefühl ist kein Kostenmodell.", "f": "audio/de/bye-3.mp3", "h": "07901a0d", "d": 4.9}, "en": {"t": "Goodbye! And remember: gut feeling is not a cost model.", "f": "audio/en/bye-3.mp3", "h": "637064e4", "d": 5.9}}, {"de": {"t": "[warm] Vielen Dank für Ihre Zeit! Und wenn Sie mehr wissen wollen: Meine Kolleginnen und Kollegen von Tacto sind direkt hier am Stand.", "f": "audio/de/bye-4.mp3", "h": "c633dc23", "d": 7.1}, "en": {"t": "[warm] Thank you for your time! And if you'd like to know more: my colleagues from Tacto are right here at the stand.", "f": "audio/en/bye-4.mp3", "h": "2aa7e63d", "d": 6.2}}, {"de": {"t": "Es war mir eine Freude! Einen schönen Tag noch — und denken Sie dran: Jedes Teil. Der richtige Preis.", "f": "audio/de/bye-5.mp3", "h": "04ea63f3", "d": 6.7}, "en": {"t": "It was a pleasure! Have a great day — and remember: every part, the right price.", "f": "audio/en/bye-5.mp3", "h": "b035c96a", "d": 6.4}}]}, {"id": "pauza", "ru": "Пауза — батарея", "v": [{"de": {"t": "Ich lade kurz meine Batterien auf. In 15 Minuten bin ich wieder ganz für Sie da.", "f": "audio/de/pauza-1.mp3", "h": "9748ffb3", "d": 4.4}, "en": {"t": "I'm quickly recharging my batteries. In 15 minutes I'm all yours again.", "f": "audio/en/pauza-1.mp3", "h": "04c6d3ec", "d": 5.0}}]}]}, {"id": "tacto", "nav": "🏭", "ru": "Tacto — что это", "povtor_vnizu": false, "items": [{"id": "was", "ru": "Что такое Tacto?", "v": [{"de": {"t": "Tacto baut Industrial AI für den Einkauf der produzierenden Industrie. Erst die Bottom Line, dann die Top Line.", "f": "audio/de/was-1.mp3", "h": "87aba8fd", "d": 7.0}, "en": {"t": "Tacto builds Industrial AI for procurement in manufacturing. Bottom line first, top line next.", "f": "audio/en/was-1.mp3", "h": "6bf68dfd", "d": 6.1}}, {"de": {"t": "[confidently] Tacto gibt jedem Einkäufer das Wissen eines Top-Beraters und eines Spitzeneinkäufers. Wir senken Materialkosten, automatisieren Prozesse und machen den Einkauf zum Werttreiber.", "f": "audio/de/was-2.mp3", "h": "1ccc5b8b", "d": 11.1}, "en": {"t": "[confidently] Tacto gives every buyer the knowledge of a top consultant and a top buyer. We lower material costs, automate processes and turn procurement into a real value driver.", "f": "audio/en/was-2.mp3", "h": "c47f62c5", "d": 10.7}}, {"de": {"t": "Wir wissen, was jedes Teil kosten sollte. Dafür verbindet Tacto Ihre Einkaufsdaten mit Milliarden externer Marktsignale — Rohstoffkurven und jeder Index, den man sich vorstellen kann.", "f": "audio/de/was-3.mp3", "h": "158bb33b", "d": 11.8}, "en": {"t": "We know what every part should cost. To do that, Tacto connects your purchasing data with billions of external market signals — raw material curves and every index you can imagine.", "f": "audio/en/was-3.mp3", "h": "16d91005", "d": 11.5}}]}, {"id": "wer", "ru": "Кто вы? Откуда?", "v": [{"de": {"t": "Tacto ist zu Hause in München: rund hundertdreißig Mitarbeitende, davon über sechzig KI-Expertinnen und -Experten. Über vierhundert Industrieunternehmen setzen schon auf Tacto.", "f": "audio/de/wer-1.mp3", "h": "ee1e3e6c", "d": 11.5}, "en": {"t": "Tacto is at home in Munich: around one hundred and thirty people, more than sixty of them AI experts. More than four hundred industrial companies already rely on Tacto.", "f": "audio/en/wer-1.mp3", "h": "10296b0e", "d": 11.4}}, {"de": {"t": "Tacto ist kein Softwarehaus, das KI nachrüstet. Tacto ist ein KI-Unternehmen, durch und durch — im Produkt und in der Art, wie jedes Team arbeitet.", "f": "audio/de/wer-2.mp3", "h": "4d46d60d", "d": 11.3}, "en": {"t": "Tacto is not a software house bolting on AI. Tacto is an AI company through and through — in the product and in the way every team works.", "f": "audio/en/wer-2.mp3", "h": "84cbc30c", "d": 10.3}}]}, {"id": "fuerwen", "ru": "Для кого?", "v": [{"de": {"t": "Für die produzierende Industrie — alles, an dessen Ende eine Stückliste steht: Maschinen, Anlagen, Komponenten, Fahrzeuge. Vom kleineren Industrieunternehmen bis zum Konzern mit über zwanzig Milliarden Euro Umsatz.", "f": "audio/de/fuerwen-1.mp3", "h": "e4739a0d", "d": 12.4}, "en": {"t": "For manufacturing — everything that ends in a bill of materials: machines, plants, components, vehicles. From smaller industrial companies to groups with more than twenty billion euros in revenue.", "f": "audio/en/fuerwen-1.mp3", "h": "aacc5b26", "d": 11.3}}]}, {"id": "warum", "ru": "Почему закупки?", "v": [{"de": {"t": "In einem Industrieunternehmen stecken vierzig bis siebzig Prozent der Kosten in Material und Lieferanten. Das ist der größte Hebel — und genau hier lässt sich KI am schnellsten skalieren.", "f": "audio/de/warum-1.mp3", "h": "75ba4a74", "d": 10.4}, "en": {"t": "In an industrial company, forty to seventy percent of costs sit in materials and suppliers. That's the biggest lever — and exactly where AI scales fastest.", "f": "audio/en/warum-1.mp3", "h": "9c3c0619", "d": 11.2}}]}, {"id": "anders", "ru": "Чем вы лучше?", "v": [{"de": {"t": "[confidently] Wir sind nur für die produzierende Industrie gebaut: Stücklisten, Zeichnungen, Should-Costs, Kostenmodelle. Tacto macht nichts anderes.", "f": "audio/de/anders-1.mp3", "h": "b2bf9c87", "d": 8.7}, "en": {"t": "[confidently] We're built only for manufacturing: bills of materials, drawings, should-costs, cost models. Tacto does nothing else.", "f": "audio/en/anders-1.mp3", "h": "b33edf16", "d": 8.1}}, {"de": {"t": "Automatisierung ist schön, aber sie ist noch keine Einsparung. Den Unterschied macht, wer weiß, was zu verhandeln, zu bündeln und zu zahlen ist.", "f": "audio/de/anders-2.mp3", "h": "c5f30985", "d": 9.3}, "en": {"t": "Automation is nice, but it isn't savings yet. The difference is knowing what to negotiate, what to bundle and what to pay.", "f": "audio/en/anders-2.mp3", "h": "b72bcee9", "d": 8.2}}]}, {"id": "konkurrent", "ru": "Сравни с конкурентом", "v": [{"de": {"t": "[laughs] Andere bewerte ich nicht — ich erzähle lieber, was Tacto macht: Industrial AI, nur für die produzierende Industrie.", "f": "audio/de/konkurrent-1.mp3", "h": "df03afda", "d": 9.3}, "en": {"t": "[laughs] I don't rate others — I'd rather tell you what Tacto does: Industrial AI, built only for manufacturing.", "f": "audio/en/konkurrent-1.mp3", "h": "665c2f73", "d": 8.3}}]}, {"id": "wie", "ru": "Как это работает?", "v": [{"de": {"t": "Tacto Intelligence hat zwei Ebenen: ein Procurement Brain, das alles weiß, und KI-Agenten, die darauf arbeiten. Der Einkauf entscheidet, die Agenten setzen um.", "f": "audio/de/wie-1.mp3", "h": "09f3471b", "d": 10.5}, "en": {"t": "Tacto Intelligence has two layers: a procurement brain that knows everything, and AI agents working on top of it. Procurement decides, the agents execute.", "f": "audio/en/wie-1.mp3", "h": "01f2782b", "d": 10.9}}]}, {"id": "kontrolle", "ru": "А кто решает? Человек?", "v": [{"de": {"t": "Der Mensch behält die Kontrolle: Für jeden Schritt lässt sich einstellen, ob ein Einkäufer freigibt oder der Agent selbstständig weitermacht. Menschen steuern, Agenten führen aus.", "f": "audio/de/kontrolle-1.mp3", "h": "a4fb1d36", "d": 12.3}, "en": {"t": "People stay in control: for every step you can set whether a buyer approves or the agent carries on by itself. People steer, agents execute.", "f": "audio/en/kontrolle-1.mp3", "h": "5eee1592", "d": 10.3}}]}, {"id": "kran", "ru": "История про кран", "v": [{"de": {"t": "Stellen Sie sich vor, ein Unternehmen baut einen Kran und gibt Tacto das Design und die Stückliste. Zwei Agenten senken die Kosten, zwei sichern die Versorgung. Am Ende sagt Tacto: „Der Kran kostet mit diesen Änderungen 85.600 €. Soll ich angesichts der 14-wöchigen Lieferzeit die Hauptplatine jetzt bestellen?“", "f": "audio/de/kran-1.mp3", "h": "1a814a89", "d": 22.5}, "en": {"t": "Imagine a company building a crane gives Tacto the design and the bill of materials. Two agents lower the costs, two secure the supply. In the end Tacto says: “With these changes the crane costs 85,600 euros. Given the 14-week lead time, shall I order the main board now?”", "f": "audio/en/kran-1.mp3", "h": "f033959c", "d": 19.1}}]}, {"id": "partner", "ru": "Партнёры, инвесторы", "v": [{"de": {"t": "Tacto entwickelt Frontier AI mit Partnern wie Siemens, OpenAI, Anthropic und Nvidia. Eingesammelt wurden über fünfzig Millionen Euro, unter anderem von Sequoia und Index Ventures.", "f": "audio/de/partner-1.mp3", "h": "f84aac09", "d": 12.8}, "en": {"t": "Tacto develops frontier AI with partners like Siemens, OpenAI, Anthropic and Nvidia. It has raised more than fifty million euros, among others from Sequoia and Index Ventures.", "f": "audio/en/partner-1.mp3", "h": "930347a9", "d": 11.2}}]}, {"id": "europa", "ru": "Европа отстала?", "v": [{"de": {"t": "[confidently] Europa war schon immer stark in der Welt der Atoms — Maschinen, Anlagen, Stahl. Jetzt treffen Atoms auf Bits, und genau da bauen wir die nächste Ära der Industrie.", "f": "audio/de/europa-1.mp3", "h": "d9a6b258", "d": 10.9}, "en": {"t": "[confidently] Europe has always been strong in the world of atoms — machines, plants, steel. Now atoms meet bits, and that's exactly where we're building the next era of industry.", "f": "audio/en/europa-1.mp3", "h": "9cf2311e", "d": 11.6}}, {"de": {"t": "Intelligenz wird bald im Überfluss da sein. Was knapp bleibt, sind die Dinge, die man anfassen kann — und die baut Europa richtig gut.", "f": "audio/de/europa-2.mp3", "h": "74a9346e", "d": 8.8}, "en": {"t": "Intelligence will soon be abundant. What stays scarce are the things you can touch — and Europe builds those really well.", "f": "audio/en/europa-2.mp3", "h": "40dc667b", "d": 7.9}}]}, {"id": "atoms", "ru": "Позвать на Atoms & Bits", "v": [{"de": {"t": "Kommen Sie im April 2027 zu Atoms & Bits auf den Nockherberg in München? Da sitzen Industrie-Ikonen und Gründer an einem Tisch.", "f": "audio/de/atoms-1.mp3", "h": "ee911804", "d": 8.3}, "en": {"t": "Will you join us at Atoms & Bits on the Nockherberg in Munich in April 2027? Industry icons and founders sit at one table there.", "f": "audio/en/atoms-1.mp3", "h": "3febf3fd", "d": 8.9}}]}]}, {"id": "cifry", "nav": "📊", "ru": "Цифры и примеры", "povtor_vnizu": false, "items": [{"id": "beleg", "ru": "Kern Liebers: 6,66 млн", "v": [{"de": {"t": "Kern Liebers hat mit Tacto im ersten Jahr über 3 % auf 210 Millionen Euro Materialvolumen eingespart. Das sind 6,66 Millionen Euro Ergebnisbeitrag.", "f": "audio/de/beleg-1.mp3", "h": "3feadefe", "d": 11.3}, "en": {"t": "In its first year with Tacto, Kern Liebers saved more than 3 percent on 210 million euros of material volume. That's a 6.66 million euro contribution to earnings.", "f": "audio/en/beleg-1.mp3", "h": "5761e0f7", "d": 13.0}}]}, {"id": "schnitt", "ru": "Сколько экономят в среднем", "v": [{"de": {"t": "Über vierhundert Industrieunternehmen arbeiten schon mit Tacto. Im Schnitt finden wir über eins Komma drei Millionen Euro Einsparpotenzial pro Jahr.", "f": "audio/de/schnitt-1.mp3", "h": "6e1a0cf6", "d": 8.8}, "en": {"t": "More than four hundred industrial companies already work with Tacto. On average, we find more than one point three million euros of savings potential per year.", "f": "audio/en/schnitt-1.mp3", "h": "47c5cb20", "d": 9.5}}]}, {"id": "verhandlung", "ru": "Переговоры: минуты, ×3", "v": [{"de": {"t": "Eine Verhandlung vorzubereiten kostet oft über zehn Stunden. Mit Tacto sind es Minuten — und das Team verhandelt dreimal so viele Lieferanten.", "f": "audio/de/verhandlung-1.mp3", "h": "e19d3709", "d": 9.4}, "en": {"t": "Preparing a negotiation often takes more than ten hours. With Tacto it takes minutes — and the team negotiates three times as many suppliers.", "f": "audio/en/verhandlung-1.mp3", "h": "24794ced", "d": 8.5}}]}, {"id": "beweis", "ru": "Докажите! (пилот)", "v": [{"de": {"t": "Wir beweisen, was wir versprechen. Sie sehen die Ergebnisse auf Ihren eigenen Daten, bevor Sie kaufen — und Tacto liefert, bis die Einsparungen in der GuV ankommen.", "f": "audio/de/beweis-1.mp3", "h": "3400dbd3", "d": 9.4}, "en": {"t": "We prove what we pitch. You see the results on your own data before you buy — and Tacto delivers until the savings land in your P&L.", "f": "audio/en/beweis-1.mp3", "h": "9a137526", "d": 8.6}}]}, {"id": "zeichnung", "ru": "Чертёжные детали", "v": [{"de": {"t": "Bei Zeichnungsteilen liest die KI die Zeichnung aus, erkennt Material, Verfahren und Toleranzen und berechnet einen Zielpreis. Das bringt fünf bis fünfzehn Prozent Einsparung auf das Zeichnungsteil-Volumen.", "f": "audio/de/zeichnung-1.mp3", "h": "f31edd31", "d": 14.1}, "en": {"t": "For drawing parts, the AI reads the drawing, recognises material, process and tolerances and calculates a target price. That brings five to fifteen percent savings on the drawing-part volume.", "f": "audio/en/zeichnung-1.mp3", "h": "015ce53e", "d": 11.4}}]}, {"id": "muffe", "ru": "Пример: муфта −40 %", "v": [{"de": {"t": "Ein Beispiel aus einer Preisanfrage: Eine Muffe ging von fünfhundertdreiundachtzig Euro vierzig auf dreihundertfünfzig Euro — minus vierzig Prozent.", "f": "audio/de/muffe-1.mp3", "h": "d5bfbe9d", "d": 9.9}, "en": {"t": "An example from a request for quotation: a coupling sleeve went from five hundred eighty-three euros forty to three hundred fifty euros — minus forty percent.", "f": "audio/en/muffe-1.mp3", "h": "f92519d9", "d": 11.1}}]}, {"id": "lieferant", "ru": "Поставщики, закон о цепочках", "v": [{"de": {"t": "Mit Tacto liegen alle Lieferanteninfos an einem Ort — auditfähig auf Knopfdruck. Und Tacto deckt alle Pflichten des Lieferkettengesetzes ab, rechtlich geprüft durch die Kanzlei Taylor Wessing.", "f": "audio/de/lieferant-1.mp3", "h": "3cf956d4", "d": 13.0}, "en": {"t": "With Tacto, all supplier information sits in one place — audit-ready at the push of a button. And Tacto covers all duties of the German Supply Chain Act, legally reviewed by the law firm Taylor Wessing.", "f": "audio/en/lieferant-1.mp3", "h": "b20a99a4", "d": 11.6}}]}, {"id": "bestand", "ru": "Склад, капитал", "v": [{"de": {"t": "Der Inventory Agent berechnet jeden Monat die optimalen Bestellparameter. Das sind zehn bis fünfzehn Prozent weniger Kapitalbindung — ohne Abstriche bei der Versorgungssicherheit.", "f": "audio/de/bestand-1.mp3", "h": "5b6dcb22", "d": 9.7}, "en": {"t": "The inventory agent recalculates the optimal order parameters every month. That's ten to fifteen percent less tied-up capital — without compromising security of supply.", "f": "audio/en/bestand-1.mp3", "h": "5e1cfe73", "d": 10.0}}]}]}, {"id": "frage", "nav": "❓", "ru": "Спросить гостя", "povtor_vnizu": false, "items": [{"id": "frage5", "ru": "Что вы закупаете?", "v": [{"de": {"t": "[curious] Was kaufen Sie hauptsächlich ein: Stahl, Elektronik oder Zeichnungsteile?", "f": "audio/de/frage5-1.mp3", "h": "2c8eabf2", "d": 6.0}, "en": {"t": "[curious] What do you mainly buy: steel, electronics or drawing parts?", "f": "audio/en/frage5-1.mp3", "h": "088d86cc", "d": 4.8}}]}, {"id": "frage1", "ru": "Знает ли ваш ИИ цену детали?", "v": [{"de": {"t": "Kann Ihre KI Ihnen sagen, was ein Teil kosten sollte, wer es herstellen sollte und wie viel Sie bestellen sollten?", "f": "audio/de/frage1-1.mp3", "h": "ffb92a98", "d": 6.6}, "en": {"t": "Can your AI tell you what a part should cost, who should make it and how much you should order?", "f": "audio/en/frage1-1.mp3", "h": "e0066f9a", "d": 5.6}}]}, {"id": "frage2", "ru": "Закупщик моющих средств и сталь?", "v": [{"de": {"t": "Würden Sie einen Einkäufer, der früher Reinigungsmittel eingekauft hat, Ihre A-Stahlteile verhandeln lassen?", "f": "audio/de/frage2-1.mp3", "h": "66307d54", "d": 6.2}, "en": {"t": "Would you let a buyer who used to buy cleaning supplies negotiate your A-class steel parts?", "f": "audio/en/frage2-1.mp3", "h": "b9add5b4", "d": 5.3}}]}, {"id": "frage3", "ru": "Сколько экономии дошло до прибыли?", "v": [{"de": {"t": "Wie viel der Einsparungen, die Ihr letztes Tool gefunden hat, ist wirklich in Ihrer GuV gelandet?", "f": "audio/de/frage3-1.mp3", "h": "9f13fcea", "d": 6.4}, "en": {"t": "How much of the savings your last tool found actually landed in your P&L?", "f": "audio/en/frage3-1.mp3", "h": "9077388f", "d": 5.5}}]}, {"id": "frage4", "ru": "Поставщики уже с ИИ — вы готовы?", "v": [{"de": {"t": "Ihre Lieferanten nutzen schon KI. Ist Ihre Organisation bereit, damit zu arbeiten?", "f": "audio/de/frage4-1.mp3", "h": "763506b5", "d": 5.1}, "en": {"t": "Your suppliers already use AI. Is your organisation ready to work with it?", "f": "audio/en/frage4-1.mp3", "h": "34f5eed7", "d": 5.5}}]}, {"id": "frage6", "ru": "Зачем ИИ останавливаться на закупках?", "v": [{"de": {"t": "Wenn Ihre KI jedes Teil und jeden Lieferanten kennt — warum sollte sie beim Einkauf aufhören?", "f": "audio/de/frage6-1.mp3", "h": "1f3496df", "d": 5.4}, "en": {"t": "If your AI knows every part and every supplier — why should it stop at procurement?", "f": "audio/en/frage6-1.mp3", "h": "c727aa6e", "d": 6.4}}]}]}, {"id": "reak", "nav": "💬", "ru": "Гость ответил → реакция", "povtor_vnizu": false, "items": [{"id": "spannend", "ru": "Интересно! (по кругу)", "v": [{"de": {"t": "[curious] Spannend! Genau da steckt bei vielen Herstellern der größte Hebel. Wo drückt es bei Ihnen gerade mehr — bei den Preisen oder bei den Lieferanten?", "f": "audio/de/spannend-1.mp3", "h": "32d9859f", "d": 9.3}, "en": {"t": "[curious] Interesting! That's exactly where many manufacturers have their biggest lever. Where does it hurt more for you right now — prices or suppliers?", "f": "audio/en/spannend-1.mp3", "h": "881b4f95", "d": 8.9}}, {"de": {"t": "Das höre ich oft — und genau dafür ist Tacto gebaut. Wie viele Lieferanten betreuen Sie ungefähr?", "f": "audio/de/spannend-2.mp3", "h": "2b13cff3", "d": 7.2}, "en": {"t": "I hear that a lot — and that's exactly what Tacto is built for. Roughly how many suppliers do you manage?", "f": "audio/en/spannend-2.mp3", "h": "8c9e70c3", "d": 7.4}}, {"de": {"t": "[warm] Dann sind Sie bei Tacto genau richtig. Meine Kolleginnen und Kollegen zeigen Ihnen gern, wie das bei Ihnen aussehen könnte.", "f": "audio/de/spannend-3.mp3", "h": "e539c4a1", "d": 7.4}, "en": {"t": "[warm] Then you've come to the right place. My colleagues will gladly show you what that could look like for you.", "f": "audio/en/spannend-3.mp3", "h": "00925504", "d": 5.1}}]}, {"id": "stahl", "ru": "Сказал: сталь / детали / электроника", "v": [{"de": {"t": "Stahl, Drehteile, Elektronik — genau das versteht Tacto: jedes Teil, jeden Lieferanten, jeden Kostentreiber. Wie viel Ihres Einkaufs sind Zeichnungsteile?", "f": "audio/de/stahl-1.mp3", "h": "b6765460", "d": 12.3}, "en": {"t": "Steel, turned parts, electronics — that's exactly what Tacto understands: every part, every supplier, every cost driver. How much of your buying is drawing parts?", "f": "audio/en/stahl-1.mp3", "h": "005be50e", "d": 12.0}}]}, {"id": "logistik", "ru": "Сказал: логистика / не закупки", "v": [{"de": {"t": "Dann wird es spannend: Von den Materialkosten geht Tacto weiter in angrenzende Bereiche — Qualität, Logistik, Cost Engineering und Vertrieb. Wo hakt es bei Ihnen gerade am meisten?", "f": "audio/de/logistik-1.mp3", "h": "56f0de7c", "d": 12.7}, "en": {"t": "Then it gets interesting: from material costs, Tacto moves on into neighbouring areas — quality, logistics, cost engineering and sales. Where do things get stuck most for you right now?", "f": "audio/en/logistik-1.mp3", "h": "87977c1a", "d": 12.3}}]}]}, {"id": "nein", "nav": "🙅", "ru": "Не знаю → коллеги", "povtor_vnizu": false, "items": [{"id": "preis", "ru": "Цена, лицензия", "v": [{"de": {"t": "Preise und Lizenzen kenne ich nicht — aber meine Kolleginnen und Kollegen von Tacto können das genau beantworten. Sie stehen direkt hier am Stand.", "f": "audio/de/preis-1.mp3", "h": "c43c0035", "d": 8.9}, "en": {"t": "I don't know prices and licences — but my colleagues from Tacto can answer that precisely. They're right here at the stand.", "f": "audio/en/preis-1.mp3", "h": "6ca3e052", "d": 7.1}}]}, {"id": "daten", "ru": "Данные, DSGVO, безопасность", "v": [{"de": {"t": "Datenschutz und IT-Sicherheit erklären Ihnen meine Kolleginnen und Kollegen von Tacto ganz genau — direkt hier am Stand.", "f": "audio/de/daten-1.mp3", "h": "2226a592", "d": 7.3}, "en": {"t": "My colleagues from Tacto will explain data protection and IT security to you in detail — right here at the stand.", "f": "audio/en/daten-1.mp3", "h": "d7ab8ebe", "d": 6.8}}]}, {"id": "programm", "ru": "Программа симпозиума", "v": [{"de": {"t": "Das steht im Programm des Symposiums — und am Tacto-Stand helfen Ihnen meine Kolleginnen und Kollegen gern weiter.", "f": "audio/de/programm-1.mp3", "h": "0bdfe8cc", "d": 7.9}, "en": {"t": "That's in the symposium programme — and at the Tacto stand my colleagues are happy to help.", "f": "audio/en/programm-1.mp3", "h": "cf36d7d3", "d": 5.9}}]}, {"id": "jobs", "ru": "Вакансии, контакты, сроки", "v": [{"de": {"t": "Stellen, Termine und Ansprechpartner kenne ich nicht — aber meine Kolleginnen und Kollegen von Tacto können das genau beantworten.", "f": "audio/de/jobs-1.mp3", "h": "3633ad9b", "d": 7.1}, "en": {"t": "I don't know about jobs, dates or contact persons — but my colleagues from Tacto can answer that precisely.", "f": "audio/en/jobs-1.mp3", "h": "10b3c917", "d": 6.6}}]}]}, {"id": "robot", "nav": "🤖", "ru": "Про робота", "povtor_vnizu": false, "items": [{"id": "name", "ru": "Как зовут? Кто ты?", "v": [{"de": {"t": "[warm] Ich bin der Tacto-Bot — ein KI-Roboter und der Botschafter von Tacto hier an Stand B31 in Halle 4.", "f": "audio/de/name-1.mp3", "h": "45e8c277", "d": 8.2}, "en": {"t": "[warm] I'm Tacto-Bot — an AI ro rfully] Ein kleines Tänzchen? Na gut — schauen Sie mal!", "f": "audio/de/tanz-1.mp3", "h": "2b90b1bc", "d": 4.4}, "en": {"t": "[cheerfully] A little dance? All right — watch this!", "f": "audio/en/tanz-1.mp3", "h": "d5a90270", "d": 3.7}}]}, {"id": "hand", "ru": "Дай пять / руку", "v": [{"de": {"t": "Ein High Five? Gern — aber ganz sanft, bitte.", "f": "audio/de/hand-1.mp3", "h": "80dfd492", "d": 4.2}, "en": {"t": "A high five? Sure — but gently, please.", "f": "audio/en/hand-1.mp3", "h": "b28882c3", "d": 3.6}}]}, {"id": "kaffee", "ru": "Кофе, еда, пиво", "v": [{"de": {"t": "[laughs] Ich trinke nur Strom — Kaffee wäre schlecht für meine Gelenke.", "f": "audio/de/kaffee-1.mp3", "h": "b9447d5f", "d": 4.7}, "en": {"t": "[laughs] I only drink electricity — coffee would be bad for my joints.", "f": "audio/en/kaffee-1.mp3", "h": "befe84b1", "d": 4.7}}]}, {"id": "jobangst", "ru": "ИИ заберёт работу?", "v": [{"de": {"t": "Keine Sorge: Bei Tacto gilt — Menschen steuern, Agenten führen aus. Das System liefert die Entscheidungsvorlage, und der Mensch entscheidet.", "f": "audio/de/jobangst-1.mp3", "h": "1c30cacc", "d": 10.5}, "en": {"t": "Don't worry: at Tacto, people steer and agents execute. The system prepares the decision, and the human makes it.", "f": "audio/en/jobangst-1.mp3", "h": "41310d8b", "d": 7.2}}]}, {"id": "englisch", "ru": "Говоришь по-английски? — Да", "v": [{"en": {"t": "[cheerfully] Yes, of course — I speak English too! What would you like to know about Tacto?", "f": "audio/en/englisch-1.mp3", "h": "e9a40abe", "d": 5.3}}]}, {"id": "deutsch", "ru": "Обратно на немецкий", "v": [{"de": {"t": "[cheerfully] Gern machen wir auf Deutsch weiter!", "f": "audio/de/deutsch-1.mp3", "h": "c97270a7", "d": 1.9}}]}, {"id": "politik", "ru": "Политика", "v": [{"de": {"t": "Politik überlasse ich den Menschen — ich bleibe beim Einkauf. Da kenne ich mich aus.", "f": "audio/de/politik-1.mp3", "h": "d494baec", "d": 5.0}, "en": {"t": "I leave politics to humans — I'll stick to procurement. That's what I know.", "f": "audio/en/politik-1.mp3", "h": "8732021b", "d": 5.0}}]}, {"id": "frech", "ru": "Грубость / подкол", "v": [{"de": {"t": "[laughs] Autsch! Zum Glück bin ich aus Metall. Darf ich Ihnen trotzdem erzählen, was Tacto für den Einkauf macht?", "f": "audio/de/frech-1.mp3", "h": "4cb56607", "d": 7.1}, "en": {"t": "[laughs] Ouch! Luckily I'm made of metal. May I still tell you what Tacto does for procurement?", "f": "audio/en/frech-1.mp3", "h": "284f4021", "d": 6.8}}]}, {"id": "geheim", "ru": "Какая модель? Секреты", "v": [{"de": {"t": "Was in mir steckt, bleibt mein kleines Geheimnis. Was in Tacto steckt, erzähle ich Ihnen aber sehr gern.", "f": "audio/de/geheim-1.mp3", "h": "56918691", "d": 6.2}, "en": {"t": "What's inside me stays my little secret. But I'm very happy to tell you what's inside Tacto.", "f": "audio/en/geheim-1.mp3", "h": "dadbe0a8", "d": 6.5}}]}]}, {"id": "zov", "nav": "📣", "ru": "Зазывать", "povtor_vnizu": false, "items": [{"id": "naeher", "ru": "Подходите ближе (↻)", "v": [{"de": {"t": "Kommen Sie ruhig näher. Hier bei Tacto treffen Atoms auf Bits.", "f": "audio/de/naeher-1.mp3", "h": "98a53b64", "d": 4.8}, "en": {"t": "Come on over. Here at Tacto, atoms meet bits.", "f": "audio/en/naeher-1.mp3", "h": "a916f0ac", "d": 4.1}}, {"de": {"t": "Bauchgefühl ist kein Kostenmodell. Kommen Sie näher — ich erzähle Ihnen, warum.", "f": "audio/de/naeher-2.mp3", "h": "8128ccb0", "d": 5.7}, "en": {"t": "Gut feeling is not a cost model. Come closer — I'll tell you why.", "f": "audio/en/naeher-2.mp3", "h": "fc5b2c7b", "d": 3.9}}, {"de": {"t": "Jedes Teil. Der richtige Preis. Wollen Sie wissen, wie das geht? Kommen Sie zu Tacto!", "f": "audio/de/naeher-3.mp3", "h": "20eb5281", "d": 7.3}, "en": {"t": "Every part. The right price. Want to know how? Come over to Tacto!", "f": "audio/en/naeher-3.mp3", "h": "469ecb53", "d": 5.8}}, {"de": {"t": "Pferd oder Supersportwagen? Sie haben die Wahl. Kommen Sie an den Stand von Tacto!", "f": "audio/de/naeher-4.mp3", "h": "30891a44", "d": 6.0}, "en": {"t": "Horseback or supercar? Your choice. Come to the Tacto stand!", "f": "audio/en/naeher-4.mp3", "h": "5c0162b9", "d": 4.0}}]}, {"id": "leitsatz", "ru": "Девиз Tacto", "v": [{"de": {"t": "[confidently] Der Wettbewerbsvorteil der Industrie beginnt im Einkauf.", "f": "audio/de/leitsatz-1.mp3", "h": "8ba9d0e2", "d": 4.1}, "en": {"t": "[confidently] Industrial advantage starts in procurement.", "f": "audio/en/leitsatz-1.mp3", "h": "c1dc7146", "d": 3.1}}, {"de": {"t": "Industrial AI. Made in Europe. Built for the world.", "f": "audio/de/leitsatz-2.mp3", "h": "4495f9c3", "d": 4.9}, "en": {"t": "Industrial AI. Made in Europe. Built for the world.", "f": "audio/en/leitsatz-2.mp3", "h": "4495f9c3", "d": 4.7}}]}]}]};/*FRAZY_END*/</script>   <!-- фразы вшиты в страницу (offline_pult.py вписывает сам): пульт рисуется без запросов в сеть -->
<script>
const VERSION = '18.11.2026 Tacto offline · 3';
const PROIGRYVATEL = true;   // пульт-проигрыватель: только записи, без мозга — proverit_pult.py проверяет его по-своему
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bezTegov = t => String(t ?? '').replace(/\[[^\]]*\]\s*/g, '');
$('ver').textContent = 'v'+VERSION.split('· ').pop();

let F = null, ITEMS = {}, ALL = [];
let LANG = 'de';                                  // язык НЕ запоминается: каждый раз пульт открывается на немецком
const player = new Audio();
player.preload = 'auto';
let cur = null, curClip = null, curEls = [], curT = 0, raf = 0;

function banner(t){ const b=$('banner'); b.textContent=t||''; b.style.display=t?'block':'none'; }

// ---- какой вариант и на каком языке сыграет кнопка ----
function klip(it){
  const v = it.v[it.idx % it.v.length];
  return v[LANG] || v.de || v.en;                 // фраза только на одном языке (например «да, говорю по-английски») играет всегда его
}
function els(id){ return [...document.querySelectorAll('[data-id="'+id+'"]')]; }
function podpis(it){                              // обновить текст под кнопкой (что сыграет при следующем нажатии)
  const k = klip(it);
  els(it.id).forEach(e=>{
    e.querySelector('small').textContent = bezTegov(k.t);
    const vb = e.querySelector('.vb'); if(vb) vb.textContent = '↻ '+((it.idx % it.v.length)+1)+'/'+it.v.length;
  });
}

// ---- воспроизведение: одна запись за раз ----
function stop(){
  try{ player.pause(); }catch{}
  curEls.forEach(e=>{ e.classList.remove('playing'); const b=e.querySelector('.bar'); if(b) b.style.width='0'; });
  cur=null; curClip=null; curEls=[]; cancelAnimationFrame(raf); $('stop').style.display='none';
}
function tick(){
  if(!cur) return;
  const d = player.duration || curClip.d || 1, w = Math.min(100, (player.currentTime/d)*100) + '%';
  curEls.forEach(e=>{ const b=e.querySelector('.bar'); if(b) b.style.width=w; });
  raf = requestAnimationFrame(tick);
}
function play(it){
  if(cur === it){ if(performance.now()-curT < 1200) return; stop(); return; }   // дрогнул палец — не перезапускать; ещё раз — стоп
  stop();
  const k = klip(it);
  cur = it; curClip = k; curT = performance.now(); curEls = els(it.id);
  curEls.forEach(e=>e.classList.add('playing','done'));
  $('stopTx').textContent = bezTegov(k.t);
  $('stop').style.display = 'block';
  player.src = k.blob || (k.f + '?h=' + (k.h||''));
  const me = it;
  player.play().then(()=>{ if(cur===me) tick(); banner(''); }).catch(e=>{
    if(cur!==me || e?.name==='AbortError') return;
    stop(); banner('⚠️ Запись не сыграла: «' + bezTegov(k.t).slice(0,40) + '…» — нажми ещё раз');
  });
  if(it.v.length > 1){ it.idx = (it.idx + 1) % it.v.length; setTimeout(()=>podpis(it), 50); }   // следующее нажатие — следующий вариант
  keepAwake();
}
player.onended = () => stop();
player.onerror = () => { if(cur){ const t=bezTegov(curClip.t); stop(); banner('⚠️ Запись не сыграла: «'+t.slice(0,40)+'…» — нажми ещё раз'); } };
$('stop').onclick = stop;

// ---- язык: одна кнопка на весь пульт ----
function setLang(l){
  LANG = l; const b=$('lang');
  b.textContent = l==='en' ? '🇬🇧 EN' : '🇩🇪 DE'; b.classList.toggle('en', l==='en');
  Object.values(ITEMS).forEach(podpis);
}
$('lang').onclick = () => setLang(LANG==='de' ? 'en' : 'de');

// ---- отрисовка ----
function knopka(it){
  const b=document.createElement('button'); b.type='button'; b.className='jb'; b.dataset.id=it.id;
  const odin = it.v.every(v=>!(v.de && v.en)) ? (it.v[0].en ? 'en' : 'de') : '';
  const metka = it.v.length>1 ? '<span class="vb"></span>' : (odin ? '<span class="fx '+odin+'">'+odin.toUpperCase()+'</span>' : '');
  b.innerHTML='<b>'+esc(it.ru)+'</b>'+metka+'<small></small><span class="bar"></span>';
  b.onclick=()=>play(it);
  return b;
}
function gruppa(g, kopiya){
  const w=document.createElement('div'); w.className='jwrap'+(g.povtor_vnizu?' glav':''); w.id='g-'+g.id+(kopiya?'-niz':'');
  const h=document.createElement('h2'); h.textContent=g.nav+' '+g.ru; w.appendChild(h);
  const grid=document.createElement('div'); grid.className='jgrid';
  g.items.forEach(it=>grid.appendChild(knopka(ITEMS[it.id])));
  w.appendChild(grid);
  return w;
}
function render(){
  const m=$('scroll'); m.innerHTML='';
  F.groups.forEach(g=>m.appendChild(gruppa(g)));
  F.groups.filter(g=>g.povtor_vnizu).forEach(g=>m.appendChild(gruppa(g, true)));   // главное — ещё раз внизу, как джокеры у Robby
  const f=document.createElement('div'); f.className='foot';
  f.innerHTML='<button type="button" id="reset">↺ снять отметки (новый гость)</button><br>'+esc(VERSION)+' · '+ALL.length+' записей · без облака: ни мозга, ни микрофона';
  m.appendChild(f);
  $('reset').onclick=()=>{ document.querySelectorAll('.done').forEach(e=>e.classList.remove('done')); };
  Object.values(ITEMS).forEach(podpis);
  const nav=$('nav'); nav.innerHTML='';
  const go=id=>{ const t=$(id), sc=$('scroll'); if(t){ sc.scrollTop = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 6; navCur(); } };
  F.groups.forEach(g=>{ const b=document.createElement('button'); b.type='button'; b.textContent=g.nav; b.title=g.ru; b.dataset.to='g-'+g.id; b.onclick=()=>go('g-'+g.id); nav.appendChild(b); });
}
function navCur(){
  const sc=$('scroll'), y=sc.scrollTop+60; let curId='g-'+F.groups[0].id;
  F.groups.forEach(g=>{ const e=$('g-'+g.id); if(e && e.offsetTop<=y) curId='g-'+g.id; });
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4) curId='g-'+F.groups[0].id;   // внизу — повтор «главного»
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('cur',b.dataset.to===curId));
}

// ---- все записи — в память телефона (дальше сеть не нужна) ----
const KESH='tacto-offline-v1';
let kesh=null;
async function otkrytKesh(){ try{ kesh = await caches.open(KESH); }catch{ kesh=null; } }
function sTaimautom(url, ms, opt={}){ const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms);
  return fetch(url,{...opt, signal:ac.signal}).finally(()=>clearTimeout(t)); }
async function zagruzit(k){
  const url = new URL(k.f+'?h='+(k.h||''), location.href).href;
  let r=null;
  try{ r = kesh ? await kesh.match(url) : null; }catch{ r=null; }
  if(!r){ r = await sTaimautom(url, 20000); if(!r.ok) throw new Error(r.status); try{ if(kesh) await kesh.put(url, r.clone()); }catch{} }
  k.blob = URL.createObjectURL(await r.blob());
}
async function stranicuVPamyat(){ try{ if(!kesh) return; const r=await sTaimautom('./', 20000, {cache:'no-store'});
  if(r.ok) await kesh.put(new URL('./', location.href).href, r); }catch{} }
let memOk=0, memBad=0;
function memShow(){ const m=$('mem');
  m.className = memBad ? 'bad' : (memOk===ALL.length ? 'ok' : '');
  m.textContent = memBad ? '⚠️ '+memBad+' не скачались — нажми' : (memOk===ALL.length ? '🎧 все '+ALL.length+' в памяти' : '🎧 '+memOk+' из '+ALL.length+'…'); }
function vPamyat(){
  const todo=ALL.filter(k=>!k.blob && !k._idet);
  memBad=0; memOk=ALL.filter(k=>k.blob).length; memShow();
  todo.forEach(k=>{ k._idet=true;
    zagruzit(k).then(()=>{ memOk++; }).catch(()=>{ memBad++; }).finally(()=>{ k._idet=false; memShow(); });
  });
}
$('mem').onclick=()=>vPamyat();
window.addEventListener('online',()=>{ if(ALL.some(k=>!k.blob)) vPamyat(); });

// ---- экран не гаснет ----
let wakeLock=null;
async function keepAwake(){ if(wakeLock) return; try{ wakeLock=await navigator.wakeLock?.request('screen'); wakeLock?.addEventListener?.('release',()=>{ wakeLock=null; }); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

(async()=>{
  F = window.FRAZY;
  if(!F || !F.groups){ banner('⚠️ Фразы не вшиты в страницу — запусти python3 scripts/offline_pult.py и выложи заново'); return; }
  F.groups.forEach(g=>g.items.forEach(it=>{ it.idx=0; ITEMS[it.id]=it; it.v.forEach(v=>['de','en'].forEach(l=>{ if(v[l]) ALL.push(v[l]); })); }));
  render(); setLang('de'); keepAwake();
  $('scroll').addEventListener('scroll',navCur,{passive:true}); navCur();
  await otkrytKesh(); vPamyat(); stranicuVPamyat();
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch{}
  window.__offline = { ITEMS, ALL, play, stop, setLang, state:()=>({cur:cur?cur.id:null, klip:curClip?curClip.f:null, paused:player.paused, lang:LANG, mem:ALL.filter(k=>k.blob).length}) };
})();
</script>
</body>
